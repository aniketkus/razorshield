name: RazorShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data & train models
        run: python data/train_models.py

      - name: Start API & smoke test
        run: |
          uvicorn main:app --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/metrics
          curl -f http://localhost:8000/api/v1/demo/fraud
          curl -f http://localhost:8000/api/v1/demo/return
          curl -f http://localhost:8000/api/v1/demo/chargeback

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
